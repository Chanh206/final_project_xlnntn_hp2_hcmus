# ============================================================
# docker-compose.yml — HVH Image Pipeline
# Mac M-series: platform linux/arm64
# ============================================================

version: "3.9"

services:
  hvh:
    build:
      context: .
      dockerfile: Dockerfile
      # Quan trọng: chỉ rõ platform cho Mac M-series
      args:
        BUILDPLATFORM: linux/arm64
    platform: linux/arm64
    image: hvh-pipeline:latest
    container_name: hvh_pipeline
    ports:
      - "8888:8888"
    volumes:
      # ── Dữ liệu ──────────────────────────────────────────────
      # Đặt ảnh đầu vào vào ./data/input/<mã_tác_phẩm>/
      - ./data:/workspace/data
      - ./scripts:/workspace/scripts
      - ./notebooks:/workspace/notebooks
      - ./configs:/workspace/configs
      # ── Cache model (tránh tải lại khi restart) ───────────────
      - paddle_cache:/root/.paddleocr
      - hanlp_cache:/root/.hanlp
      - hf_cache:/root/.cache/huggingface
    environment:
      # API Keys — điền vào file .env
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # Tắt GPU trong Docker (Mac M-series không support CUDA)
      - CUDA_VISIBLE_DEVICES=""
      - FLAGS_use_cuda=0
    restart: unless-stopped
    stdin_open: true
    tty: true
    # Tăng shared memory cho xử lý ảnh lớn
    shm_size: "2gb"

volumes:
  paddle_cache:
  hanlp_cache:
  hf_cache:
